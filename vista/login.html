<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Carnetización</title>

    <link rel="stylesheet" href="../estilos/estilo.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-200">

    <div class="min-h-screen flex items-center justify-center">

        <div class="bg-white p-8 rounded-xl shadow-xl w-96 relative overflow-hidden">

            <div class="absolute top-0 left-0 w-full h-2 bg-institucional"></div>

            <div class="text-center mb-6">

                <h2 class="text-2xl font-bold text-gray-800">
                    Sistema de Carnetización
                </h2>

                <p class="text-sm text-gray-500 font-semibold">
                    Distrito de Armenia
                </p>

            </div>


            <form id="login-form" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="login-user"
                        class="mt-1 block w-full rounded-md border border-gray-300 p-2 bg-gray-50 font-semibold"
                        required>
                </div>


                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="login-pass"
                        class="mt-1 block w-full rounded-md border border-gray-300 p-2 bg-gray-50 font-semibold"
                        required>
                </div>


                <button
                    type="submit"
                    class="w-full bg-institucional text-white py-2 px-4 rounded-md font-bold shadow-md">

                    <i class="fas fa-sign-in-alt"></i>
                    Ingresar al Sistema

                </button>

            </form>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>

</html>
